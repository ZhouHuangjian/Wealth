name: wealth

x-backend: &backend
  build: .
  image: wealth:local
  restart: unless-stopped
  init: true
  environment: &runtime-environment
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Create .env from .env.example}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
    DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
    WEALTH_TRUST_PROXY: ${WEALTH_TRUST_PROXY:-0}
    WEALTH_FORCE_HTTPS: ${WEALTH_FORCE_HTTPS:-0}
    WEALTH_HSTS_SECONDS: ${WEALTH_HSTS_SECONDS:-0}
    WEALTH_MARKET_DATA_ENABLED: ${WEALTH_MARKET_DATA_ENABLED:-1}
    DATABASE_URL: postgresql://wealth_app:${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}@db:5432/${POSTGRES_DB:-wealth}
    CELERY_BROKER_URL: amqp://wealth:${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}@rabbitmq:5672/wealth
    PRIVATE_MEDIA_ROOT: /app/private-media
    PYTHONUNBUFFERED: "1"
  volumes:
    - private_media:/app/private-media
  depends_on:
    db:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ${POSTGRES_DB:-wealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 256mb

  rabbitmq:
    image: rabbitmq:4.3-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: wealth
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: wealth
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 10s
      retries: 15

  migrate:
    <<: *backend
    profiles: [tools]
    restart: "no"
    environment:
      <<: *runtime-environment
      DATABASE_URL: postgresql://wealth_owner:${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD}@db:5432/${POSTGRES_DB:-wealth}
      DATABASE_URL_ADMIN: postgresql://wealth_owner:${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD}@db:5432/${POSTGRES_DB:-wealth}
    command: [python, manage.py, migrate, --noinput]

  web:
    <<: *backend
    command: [gunicorn, config.wsgi:application, --bind, "0.0.0.0:8000", --workers, "2", --threads, "2", --timeout, "120", --access-logfile, "-", --access-logformat, '%(h)s %(l)s %(u)s %(t)s "%(m)s %(U)s %(H)s" %(s)s %(b)s', --error-logfile, "-"]
    ports:
      - "127.0.0.1:${WEALTH_PORT:-8000}:8000"
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/', timeout=4)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    <<: *backend
    command: [celery, -A, config, worker, --loglevel=WARNING, --concurrency=2]
    healthcheck:
      test: [CMD-SHELL, 'celery -A config inspect ping -d "celery@$${HOSTNAME}" --timeout=5 | grep -q pong']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  beat:
    <<: *backend
    command: [celery, -A, config, beat, --loglevel=WARNING, --schedule=/app/scheduler/celerybeat-schedule, --pidfile=/app/scheduler/celerybeat.pid]
    volumes:
      - private_media:/app/private-media
      - scheduler_data:/app/scheduler
    # Exactly one beat container. Its liveness does not prove tasks are on time;
    # application job status/outbox age must be checked separately.
    healthcheck:
      test: [CMD, python, -c, "import os,pathlib; os.kill(int(pathlib.Path('/app/scheduler/celerybeat.pid').read_text()), 0)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  private_media:
  rabbitmq_data:
  scheduler_data:
