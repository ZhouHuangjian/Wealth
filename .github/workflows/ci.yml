name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: wealth_test
          POSTGRES_PASSWORD: ci-postgres-ephemeral
          DB_OWNER_PASSWORD: ci-owner-ephemeral
          DB_APP_PASSWORD: ci-runtime-ephemeral
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wealth_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://wealth_app:ci-runtime-ephemeral@127.0.0.1:5432/wealth_test
      DATABASE_URL_ADMIN: postgresql://wealth_owner:ci-owner-ephemeral@127.0.0.1:5432/wealth_test
      DJANGO_SECRET_KEY: ci-only-synthetic-key-which-never-runs-in-production-000000
      WEALTH_TESTING: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Check Python formatting and critical lint rules
        run: |
          ruff format --check backend scripts
          ruff check --select E9,F63,F7,F82 backend scripts
      - name: Initialize migration and runtime roles
        env:
          DB_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker cp infra/postgres/01-roles.sh "$DB_CONTAINER:/tmp/wealth-roles.sh"
          docker exec "$DB_CONTAINER" bash /tmp/wealth-roles.sh
      - name: Check models and migrate as owner
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          python manage.py collectstatic --noinput
      - name: Run financial and authorization tests as runtime role
        working-directory: backend
        run: pytest --junitxml=../test-results/backend.xml
      - name: Verify backup cryptography and archive boundaries
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: test-results/backend.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the same-origin runtime image
        run: docker build --pull -t wealth:ci .
